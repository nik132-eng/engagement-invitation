<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nikunj &amp; Ayushi | Engagement Invitation</title>
  <meta name="description" content="You are invited to the engagement of Nikunj &amp; Ayushi on 12 December 2026.">
  <meta property="og:title" content="Nikunj &amp; Ayushi | Engagement Invitation">
  <meta property="og:description" content="Join us to celebrate our engagement on 12 December 2026.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#71352b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Dancing+Script:wght@500;700&family=Noto+Serif+Gujarati:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.96 C0.5,0.96 0.06,0.70 0.06,0.36 C0.06,0.18 0.20,0.06 0.32,0.06 C0.42,0.06 0.48,0.14 0.5,0.24 C0.52,0.14 0.58,0.06 0.68,0.06 C0.80,0.06 0.94,0.18 0.94,0.36 C0.94,0.70 0.5,0.96 0.5,0.96 Z"/>
      </clipPath>
    </defs>
  </svg>

  <button id="langBtn" class="float-btn float-btn--left" type="button" aria-label="Change language">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    <span id="langLabel">ગુજરાતી</span>
  </button>
  <button id="musicBtn" class="float-btn float-btn--right" type="button" aria-label="Toggle music" hidden>
    <span id="musicIcon">♪</span>
  </button>

  <main>
    <!-- HERO -->
    <section class="hero" id="top">
      <div class="hearts" id="hearts" aria-hidden="true"></div>
      <svg class="flourish flourish--tl" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M5 5C5 5 20 10 30 25C40 40 35 55 25 60C15 65 10 55 15 45C20 35 35 30 45 35C55 40 50 55 40 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="25" r="2" fill="currentColor"/><circle cx="25" cy="60" r="1.5" fill="currentColor"/></svg>
      <svg class="flourish flourish--br" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M5 5C5 5 20 10 30 25C40 40 35 55 25 60C15 65 10 55 15 45C20 35 35 30 45 35C55 40 50 55 40 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="25" r="2" fill="currentColor"/><circle cx="25" cy="60" r="1.5" fill="currentColor"/></svg>

      <div class="hero__inner">
        <p class="hero__heart" aria-hidden="true">♥</p>
        <p class="hero__intro script" data-i18n="intro"></p>
        <div class="divider divider--sm"><span></span><i>♥</i><span></span></div>
        <h1 class="hero__name" data-i18n="groomName"></h1>
        <p class="hero__amp" aria-hidden="true">&amp;</p>
        <h1 class="hero__name" data-i18n="brideName"></h1>
      </div>

      <a class="scroll-hint" href="#welcome" aria-label="Scroll down">
        <span data-i18n="scroll"></span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </a>
    </section>

    <!-- WELCOME -->
    <section class="block block--narrow reveal" id="welcome">
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="welcome script" data-i18n="welcome"></p>
      <div class="divider"><span></span><i>♥</i><span></span></div>
    </section>

    <!-- FAMILIES -->
    <section class="block reveal" id="families">
      <h2 class="title script" data-i18n="familiesTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <div class="families">
        <article class="family">
          <h3 data-i18n="groomName"></h3>
          <p data-i18n="groomParents"></p>
        </article>
        <p class="families__amp" aria-hidden="true">&amp;</p>
        <article class="family">
          <h3 data-i18n="brideName"></h3>
          <p data-i18n="brideParents"></p>
        </article>
      </div>
    </section>

    <!-- DATE HEART -->
    <section class="block reveal" id="date">
      <h2 class="title script" data-i18n="foreverTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>

      <button class="heart" id="heartBtn" type="button" aria-label="Celebrate">
        <span class="heart__shape">
          <span class="heart__text">
            <span class="heart__kicker script" data-i18n="invited"></span>
            <strong id="dateShort"></strong>
            <span class="script" id="dateWeekday"></span>
            <small id="dateTime"></small>
          </span>
        </span>
        <svg class="heart__outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50,96 C50,96 6,70 6,36 C6,18 20,6 32,6 C42,6 48,14 50,24 C52,14 58,6 68,6 C80,6 94,18 94,36 C94,70 50,96 50,96 Z" fill="none" stroke="currentColor" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
      </button>

      <div class="save">
        <button class="btn" id="saveBtn" type="button" aria-expanded="false" aria-controls="saveMenu" data-i18n="saveDate"></button>
        <div class="save__menu" id="saveMenu" hidden>
          <a id="gcalLink" target="_blank" rel="noopener" data-i18n="googleCal"></a>
          <button type="button" id="icsBtn" data-i18n="downloadIcs"></button>
        </div>
      </div>
    </section>

    <!-- GALLERY (shown only when photos are set in config.js) -->
    <section class="block reveal" id="gallerySection" hidden>
      <h2 class="title script" data-i18n="galleryTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <div class="gallery" id="gallery" tabindex="0" aria-label="Photo gallery"></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="block reveal" id="countdownSection">
      <h2 class="title script" data-i18n="countTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <div class="count" id="count" role="timer" aria-live="off">
        <div><b id="cd-d">00</b><span data-i18n="days"></span></div>
        <div><b id="cd-h">00</b><span data-i18n="hours"></span></div>
        <div><b id="cd-m">00</b><span data-i18n="minutes"></span></div>
        <div><b id="cd-s">00</b><span data-i18n="seconds"></span></div>
      </div>
    </section>

    <!-- PROGRAM -->
    <section class="block block--narrow reveal" id="program">
      <h2 class="title script" data-i18n="programTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="program__date" id="programDate"></p>
      <div class="program__row">
        <span class="program__time" id="programTime"></span>
        <p class="program__event" data-i18n="event"></p>
      </div>
    </section>

    <!-- VENUE -->
    <section class="block block--narrow reveal" id="venue">
      <h2 class="title script" data-i18n="venueTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="venue__name" id="venueName"></p>
      <p class="venue__addr" id="venueAddr"></p>
      <a class="btn" id="mapBtn" target="_blank" rel="noopener" data-i18n="directions"></a>
    </section>

    <!-- GIFTS -->
    <section class="block block--narrow reveal" id="gifts">
      <h2 class="title script" data-i18n="giftsTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="plain" data-i18n="gifts"></p>
    </section>

    <!-- RSVP (shown only when a WhatsApp number is set in config.js) -->
    <section class="block block--narrow reveal" id="rsvp" hidden>
      <h2 class="title script">RSVP</h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <form class="form" id="rsvpForm">
        <label><span data-i18n="fName"></span>
          <input name="name" required autocomplete="name">
        </label>
        <label><span data-i18n="fAttend"></span>
          <select name="attend" required>
            <option value="" data-i18n="fSelect"></option>
            <option value="yes" data-i18n="fYes"></option>
            <option value="no" data-i18n="fNo"></option>
          </select>
        </label>
        <label><span data-i18n="fMsg"></span>
          <textarea name="msg" rows="3"></textarea>
        </label>
        <button class="btn btn--full" type="submit" data-i18n="fSend"></button>
      </form>
    </section>

    <!-- CLOSING -->
    <section class="block block--narrow closing reveal">
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="closing__line script" data-i18n="closing"></p>
      <p class="closing__names script" data-i18n="signoff"></p>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer"></p>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <audio id="bgm" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
