<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The invitation has its own English and Gujarati wording (use the language button); stop browsers auto-translating it -->
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="en, gu">
  <title>Nikunj &amp; Ayushi Engagement Invitation | 12 December 2026</title>
  <meta name="description" content="You are warmly invited to the engagement of Nikunj Rohit &amp; Ayushi Andhariya on 12 December 2026 at 4:30 PM. See the venue, countdown and reply online.">
  <meta name="keywords" content="Nikunj, Ayushi, engagement invitation, ring ceremony, 12 December 2026, Rohit family, Andhariya family, Gujarati invitation">
  <meta name="author" content="Rohit &amp; Andhariya families">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#71352b">
  <meta name="color-scheme" content="light">

  <!-- Social previews. If you add a custom domain, change it in the og:image and twitter:image tags below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nikunj &amp; Ayushi">
  <meta property="og:title" content="Nikunj &amp; Ayushi | Engagement Invitation">
  <meta property="og:description" content="Join us to celebrate our engagement on 12 December 2026 at 4:30 PM.">
  <meta property="og:image" content="https://nikunj-ayushi-engagement-invitation.vercel.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Nikunj and Ayushi engagement invitation, 12 December 2026">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nikunj &amp; Ayushi | Engagement Invitation">
  <meta name="twitter:description" content="Join us to celebrate our engagement on 12 December 2026 at 4:30 PM.">
  <meta name="twitter:image" content="https://nikunj-ayushi-engagement-invitation.vercel.app/assets/og-image.png">

  <script type="application/ld+json" id="ld">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "Engagement of Nikunj & Ayushi",
    "description": "Engagement ceremony of Nikunj Rohit and Ayushi Andhariya, hosted by the Rohit and Andhariya families.",
    "startDate": "2026-12-12T16:30:00+05:30",
    "endDate": "2026-12-12T20:30:00+05:30",
    "eventStatus": "https://schema.org/EventScheduled",
    "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
    "isAccessibleForFree": true,
    "inLanguage": ["en", "gu"],
    "location": { "@type": "Place", "name": "Engagement venue", "address": { "@type": "PostalAddress", "addressCountry": "IN" } },
    "organizer": { "@type": "Organization", "name": "Rohit and Andhariya families" }
  }
  </script>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Dancing+Script:wght@500;700&family=Noto+Serif+Gujarati:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Vercel Web Analytics: private visitor counts, visible only in your Vercel dashboard -->
  <script defer src="analytics.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <noscript><style>#splash{display:none!important}body.locked{overflow:auto!important}</style></noscript>
</head>
<body class="locked">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.96 C0.5,0.96 0.06,0.70 0.06,0.36 C0.06,0.18 0.20,0.06 0.32,0.06 C0.42,0.06 0.48,0.14 0.5,0.24 C0.52,0.14 0.58,0.06 0.68,0.06 C0.80,0.06 0.94,0.18 0.94,0.36 C0.94,0.70 0.5,0.96 0.5,0.96 Z"/>
      </clipPath>
    </defs>
  </svg>

  <!-- Opening splash: the tap also unlocks background music -->
  <div id="splash" role="dialog" aria-modal="true" aria-label="Open the invitation">
    <div class="splash__inner">
      <p class="splash__kicker script" data-i18n="splashKicker">You are invited</p>
      <button id="openBtn" class="seal" type="button" aria-label="Open invitation">
        <img class="seal__logo" src="assets/logo-cream.svg" alt="" width="68" height="60">
      </button>
      <p class="splash__hint" data-i18n="tapOpen">Tap the seal to open</p>
    </div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <canvas id="petals" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <button id="langBtn" class="lang" type="button" aria-label="Change language">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
    <span id="langLabel">ગુજરાતી</span>
  </button>

  <main>
    <!-- HERO -->
    <section class="hero" id="top">
      <svg class="flourish flourish--tl" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M5 5C5 5 20 10 30 25C40 40 35 55 25 60C15 65 10 55 15 45C20 35 35 30 45 35C55 40 50 55 40 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="25" r="2" fill="currentColor"/><circle cx="25" cy="60" r="1.5" fill="currentColor"/></svg>
      <svg class="flourish flourish--br" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M5 5C5 5 20 10 30 25C40 40 35 55 25 60C15 65 10 55 15 45C20 35 35 30 45 35C55 40 50 55 40 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="25" r="2" fill="currentColor"/><circle cx="25" cy="60" r="1.5" fill="currentColor"/></svg>

      <div class="hero__inner">
        <img class="hero__logo" src="assets/logo-maroon.svg" alt="Nikunj and Ayushi monogram" width="110" height="98">
        <p class="hero__intro script" data-anim="words" data-i18n="intro"></p>
        <h1 class="hero__title">
          <span class="hero__name" data-anim="letters" data-i18n="groomName"></span>
          <span class="hero__amp" aria-hidden="true">&amp;</span>
          <span class="hero__name" data-anim="letters" data-i18n="brideName"></span>
        </h1>
      </div>

      <a class="scroll-hint" href="#families" aria-label="Scroll down">
        <span data-i18n="scroll"></span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </a>
    </section>

    <!-- FAMILIES -->
    <section class="block reveal" id="families">
      <h2 class="title script" data-anim="words" data-i18n="familiesTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="families__line script" data-anim="words" data-i18n="familiesLine"></p>
      <div class="families">
        <article class="family">
          <p class="family__parents" data-i18n="groomParents"></p>
          <p class="family__rel script" data-i18n="groomRel"></p>
          <h3 data-i18n="groomTitle"></h3>
        </article>
        <p class="families__amp" aria-hidden="true">&amp;</p>
        <article class="family">
          <p class="family__parents" data-i18n="brideParents"></p>
          <p class="family__rel script" data-i18n="brideRel"></p>
          <h3 data-i18n="brideTitle"></h3>
        </article>
      </div>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="families__blessing" data-i18n="familiesBlessing"></p>
    </section>

    <!-- DATE HEART -->
    <section class="block reveal" id="date">
      <h2 class="title script" data-anim="words" data-i18n="foreverTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>

      <div class="heart" id="heartBtn" role="group" aria-label="Date and time">
        <span class="heart__shape">
          <span class="heart__text">
            <span class="heart__kicker script" data-i18n="invited"></span>
            <span class="heart__day" id="dateDay"></span>
            <strong id="dateMonthYear"></strong>
            <span class="script" id="dateWeekday"></span>
            <small id="dateTime"></small>
          </span>
          <canvas class="heart__foil" id="heartFoil" role="button" tabindex="0"></canvas>
          <span class="heart__hint" data-i18n="scratchHint" aria-hidden="true"></span>
        </span>
        <svg class="heart__outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50,96 C50,96 6,70 6,36 C6,18 20,6 32,6 C42,6 48,14 50,24 C52,14 58,6 68,6 C80,6 94,18 94,36 C94,70 50,96 50,96 Z" fill="none" stroke="currentColor" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
      </div>

      <div class="save">
        <button class="btn" id="saveBtn" type="button" aria-expanded="false" aria-controls="saveMenu" data-i18n="saveDate"></button>
        <div class="save__menu" id="saveMenu" hidden>
          <a id="gcalLink" target="_blank" rel="noopener" data-i18n="googleCal"></a>
          <button type="button" id="icsBtn" data-i18n="downloadIcs"></button>
        </div>
      </div>
    </section>

    <!-- COUNTDOWN -->
    <section class="block reveal" id="countdownSection">
      <h2 class="title script" data-anim="words" data-i18n="countTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <div class="count" id="count" role="timer" aria-live="off">
        <div class="unit"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring" id="r-d" cx="40" cy="40" r="34"/></svg><b id="cd-d">00</b><span data-i18n="days"></span></div>
        <div class="unit"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring" id="r-h" cx="40" cy="40" r="34"/></svg><b id="cd-h">00</b><span data-i18n="hours"></span></div>
        <div class="unit"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring" id="r-m" cx="40" cy="40" r="34"/></svg><b id="cd-m">00</b><span data-i18n="minutes"></span></div>
        <div class="unit"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring" id="r-s" cx="40" cy="40" r="34"/></svg><b id="cd-s">00</b><span data-i18n="seconds"></span></div>
      </div>
      <p class="count__note" id="countNote"></p>
    </section>

    <!-- GALLERY (shown only when photos are set in config.js) -->
    <section class="block reveal" id="gallerySection" hidden>
      <h2 class="title script" data-anim="words" data-i18n="galleryTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <div class="gallery-wrap">
        <div class="gallery" id="gallery" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Photo gallery"></div>
        <button class="gallery__nav gallery__nav--prev" id="galPrev" type="button" aria-label="Previous photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="gallery__nav gallery__nav--next" id="galNext" type="button" aria-label="Next photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="btn btn--ghost gallery__shuffle" id="galShuffle" type="button" data-i18n="galShuffle"></button>
    </section>

    <!-- PROGRAM -->
    <section class="block block--narrow reveal" id="program">
      <h2 class="title script" data-anim="words" data-i18n="programTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="program__date" id="programDate"></p>
      <p class="program__time" id="programTime"></p>
      <ol class="outline">
        <li data-i18n="stepChandla"></li>
        <li data-i18n="stepGoldhana"></li>
        <li data-i18n="stepRing"></li>
        <li data-i18n="stepGreetings"></li>
        <li data-i18n="stepDinner"></li>
      </ol>
    </section>

    <!-- VENUE + DISTANCE -->
    <section class="block block--narrow reveal" id="venue">
      <h2 class="title script" data-anim="words" data-i18n="venueTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="venue__name" id="venueName"></p>
      <p class="venue__addr" id="venueAddr"></p>
      <a class="btn" id="mapBtn" target="_blank" rel="noopener" data-i18n="directions"></a>

      <div class="dist" id="distCard" hidden>
        <p class="dist__title" data-i18n="distTitle"></p>
        <p class="dist__out" id="distOut" aria-live="polite"></p>
        <p class="dist__place" id="distPlace"></p>
        <button class="btn btn--ghost" id="distBtn" type="button" data-i18n="distBtn"></button>
        <p class="dist__note" data-i18n="distNote"></p>
      </div>
    </section>

    <!-- RSVP -->
    <section class="block block--narrow reveal" id="rsvp">
      <h2 class="title script" data-anim="words" data-i18n="rsvpTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>

      <form class="form" id="rsvpForm" novalidate>
        <label class="field"><span data-i18n="fName"></span>
          <input name="name" id="fName" required maxlength="80" autocomplete="name">
        </label>

        <fieldset class="field">
          <legend data-i18n="fAttend"></legend>
          <div class="chips">
            <label class="chip"><input type="radio" name="attend" value="yes" checked><span data-i18n="fYes"></span></label>
            <label class="chip"><input type="radio" name="attend" value="no"><span data-i18n="fNo"></span></label>
          </div>
        </fieldset>

        <div class="field" id="guestsField">
          <span data-i18n="fGuests"></span>
          <div class="stepper">
            <button type="button" id="gMinus" aria-label="Fewer guests">−</button>
            <output id="gOut">1</output>
            <button type="button" id="gPlus" aria-label="More guests">+</button>
          </div>
        </div>

        <label class="field"><span data-i18n="fMsg"></span>
          <textarea name="message" rows="3" maxlength="300"></textarea>
        </label>

        <!-- spam trap: real people never see or fill this -->
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

        <p class="form__error" id="formError" role="alert" hidden></p>
        <button class="btn btn--full" id="sendBtn" type="submit" data-i18n="fSend"></button>
      </form>

      <div class="thanks" id="thanks" hidden>
        <p class="thanks__title script" id="thanksTitle"></p>
        <p id="thanksSub"></p>
        <button class="linkbtn" id="editRsvp" type="button" data-i18n="fEdit"></button>
      </div>
    </section>

    <!-- CLOSING -->
    <section class="block block--narrow closing reveal">
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="closing__line script" data-anim="words" data-i18n="closing"></p>
      <p class="closing__names script" data-anim="words" data-i18n="signoff"></p>
    </section>
    <!-- SONGS: one playlist that plays by default (the list comes from youtubeSongs in config.js) -->
    <section class="block block--narrow reveal" id="songsSection" hidden>
      <h2 class="title script" data-anim="words" data-i18n="songsTitle"></h2>
      <div class="divider"><span></span><i>♥</i><span></span></div>
      <p class="songs__note" data-i18n="songsNote"></p>
      <div class="songs__player"><div id="ytMount"></div></div>
      <ol class="songs" id="songsList"></ol>
      <button class="btn btn--ghost" id="songsShuffle" type="button" data-i18n="songsShuffle"></button>
    </section>
  </main>

  <footer class="footer">
    <img class="footer__logo" src="assets/logo-maroon.svg" alt="" width="36" height="32">
    <p data-i18n="footer"></p>
    <p class="footer__credit">Place names from <a href="https://www.geonames.org" target="_blank" rel="noopener">GeoNames</a> (CC BY 4.0)</p>
  </footer>

  <!-- Now playing + dock (mobile first) -->
  <div class="nowplaying" id="nowPlaying" role="button" tabindex="0" title="Show the song list" hidden>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="npTitle"></span>
  </div>

  <nav class="dock" id="dock" aria-label="Quick actions">
    <button id="playBtn" type="button" aria-label="Play or pause music" aria-pressed="false">
      <svg id="icPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="nextBtn" type="button" aria-label="Next song">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/></svg>
    </button>
    <a id="dockMap" href="#venue" aria-label="Venue and directions">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    </a>
    <a class="dock__rsvp" href="#rsvp" data-i18n="dockRsvp">Reply</a>
  </nav>


  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
